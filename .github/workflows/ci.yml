name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest --durations=5

  ollama:
    name: Ollama live tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_MODEL: qwen3.5:0.8b
      OLLAMA_EMBED_MODEL: nomic-embed-text
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: ollama
        uses: ./.github/actions/setup-ollama
        with:
          models: ${{ env.OLLAMA_MODEL }} ${{ env.OLLAMA_EMBED_MODEL }}

      - name: Smoke test
        env:
          OLLAMA_HOST: ${{ steps.ollama.outputs.host }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg m "$OLLAMA_MODEL" '{
            model: $m, prompt: "Reply with exactly: ready",
            stream: false, think: false,
            options: {num_predict: 8, temperature: 0}
          }')
          resp=$(curl -fsS "$OLLAMA_HOST/api/generate" -d "$body")
          echo "$resp" | jq '{response, load_s: (.load_duration/1e9), eval_tokens_per_s: (.eval_count/(.eval_duration/1e9))}'
          echo "$resp" | jq -e '.response | ascii_downcase | contains("ready")' > /dev/null

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          cache-python: true
      - run: uv sync --locked

      - name: Live tests against Ollama
        env:
          OLLAMA_HOST: ${{ steps.ollama.outputs.host }}
        run: uv run pytest -m ollama -v --durations=0

  ci-ok:
    name: CI ok
    if: always()
    needs: [check, ollama]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
