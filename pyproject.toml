[project]
name = "wonderland-court"
version = "0.1.0"
description = "Put your AI agent on trial. A Wonderland-themed red-team arena that attacks your model or agent, judges every leak, ranks your defenses and writes the fix."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
court = "wonderland_court.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wonderland_court"]
# Non-Python files under the package (engine/schema.sql) ship by default. The built Courtroom
# UI may be gitignored, so list it as an artifact to ship it either way.
artifacts = ["src/wonderland_court/courtroom/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["ollama: needs a running Ollama server (run with `pytest -m ollama`)"]
addopts = "-m 'not ollama'"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]
